name: Flask smoke tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flask-smoke-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Flask smoke tests
        run: python -m pytest tests/test_flask_smoke.py
