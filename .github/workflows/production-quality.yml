name: Production accessibility and quality spot check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  render-production-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.1

      - name: Warm up Render service
        run: |
          curl --fail --show-error --silent \
            --retry 8 --retry-delay 10 --retry-all-errors \
            --connect-timeout 20 --max-time 120 \
            https://abcalculator.onrender.com/healthz

      - name: Run production Lighthouse spot check
        run: lhci autorun --config=lighthouserc.production.json

      - name: Upload production Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-production-report
          path: reports/lighthouse-production
          if-no-files-found: warn
