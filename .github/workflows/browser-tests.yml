name: Browser accessibility and quality checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  chromium-browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser and accessibility tests
        run: python -m pytest tests/e2e

  lighthouse-quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install application and Lighthouse dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --global @lhci/cli@0.15.1

      - name: Run Lighthouse quality gate
        run: lhci autorun --config=lighthouserc.json

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-local-report
          path: reports/lighthouse
          if-no-files-found: warn
